[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sdscaler"
version = "0.1.0"
description = "auto-scaler that picks standard/minmax/robust scaling per column"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.20",
    "pandas>=1.2",
]

[tool.setuptools.packages.find]
include = ["sdscaler*"]
